services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: incubrix-broll-backend
    env_file:
      - .env
    volumes:
      - ./jobs:/app/jobs
      - ./assets:/app/assets
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: incubrix-broll-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
